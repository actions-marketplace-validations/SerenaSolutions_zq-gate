name: 'ZQ-GATE'
description: 'Run the ZQ-GATE trivalent battery (1/0/REFUSED) in CI — ZYQL v1.9.0 kernel, GHZ device gate, sealed receipts.'
author: 'Serena Quantum Solutions'
branding:
  icon: 'check-circle'
  color: 'blue'
inputs:
  battery:
    description: 'Which battery to run (all | battery | verify-receipts)'
    required: false
    default: 'all'
runs:
  using: 'composite'
  steps:
    - run: python3 -m pip install --quiet numpy
      shell: bash
    - run: python3 ${{ github.action_path }}/src/battery_ci.py
      shell: bash
      env:
        ZQG_MODE: ${{ inputs.battery }}
